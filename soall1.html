<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Soal 1 - JavaScript Prompt</title>
    <style>
        body{
            background-color: #76c2d6;
            display: flex;
            height: 100vh;
            margin: 0;
        }
        form {
            margin: auto;
            background: white;
            text-align: center;
            padding: 15px 30px;
            border-radius: 5px;
            line-height: 1;
            font-family: arial;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 10px;
            text-align: left;
            color: #333;
            font-size: 14px;
        }
        input{
            display: block;
            border: none;
            border-bottom: solid 3px #ddd;
            margin-bottom: 10px;
            padding: 10px 0;
            font-size: 16px;
            font-family: arial;
            width: 250px;
            transition: all 300ms;
        }
        input:hover{
            border-bottom-color: #badc58;
        }
        input:focus{
            background-color: #badc58;
            outline: none;
        }
        button{
            border: none;
            background: #badc58;
            transition: all 300ms;
            padding: 10px 15px;
            font-size: 16px;
            color: white;
            border-radius: 5px;
            margin: 10px auto;
        }
        button:hover{
            cursor: pointer;
            background: #A5C24E;
        }
    </style>
</head>
<body>

    <form>
        <label for="inputNama">Nama</label>
        <input type="text" id="inputNama" readonly>
        
        <label for="inputNim">NIM</label>
        <input type="text" id="inputNim" readonly>
    </form>

    <script>
        
        let nama = prompt("Masukkan nama kamu:");
        let nim = prompt("Masukkan nim kamu:");

        if (nama !== null) {
            document.getElementById("inputNama").value = nama;
        }
        if (nim !== null) {
            document.getElementById("inputNim").value = nim;
        }
    </script>

</body>
</html>
