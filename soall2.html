<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bermain dengan Warna</title>
    <!-- Memuat pustaka jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f8ff;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #tombolUngu { background-color: #7c3aed; color: white; }
        #tombolBiru { background-color: #2563eb; color: white; }
        #tombolHijau { background-color: #15803d; color: white; }
        .btn-action { background-color: #e2e8f0; color: #333; }

        #kotakWarna {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 10px;
            transition: background-color 0.5s;
        }
    </style>
</head>
<body>

    <h1>Bermain dengan Warna</h1>
    
    <!-- Tombol Pilihan Warna -->
    <div>
        <button id="tombolUngu">Ungu</button>
        <button id="tombolBiru">Biru</button>
        <button id="tombolHijau">Hijau</button>
    </div>

    <!-- Kotak yang akan dimanipulasi -->
    <div id="kotakWarna"></div>

    <!-- Tombol Sembunyikan & Tampilkan -->
    <div>
        <button id="tombolSembunyi" class="btn-action">Sembunyikan Kotak</button>
        <button id="tombolTampil" class="btn-action">Tampilkan Kotak</button>
    </div>

    <p>Klik tombol warna untuk mengubah warna kotak.</p>
    <p>Gunakan tombol Sembunyikan dan Tampilkan untuk menyembunyikan dan menampilkan kotak.</p>

    <!-- Skrip jQuery -->
    <script>
        $(document).ready(function() {
                        $("#tombolUngu").click(function() {
                $("#kotakWarna").css("background-color", "#7c3aed");
            });

                        $("#tombolBiru").click(function() {
                $("#kotakWarna").css("background-color", "#2563eb");
            });

                        $("#tombolHijau").click(function() {
                $("#kotakWarna").css("background-color", "#15803d");
            });

                        $("#tombolSembunyi").click(function() {
                $("#kotakWarna").hide(); // Bisa juga menggunakan fadeOut()
            });

          
            $("#tombolTampil").click(function() {
                $("#kotakWarna").show(); // Bisa juga menggunakan fadeIn()
            });
        });
    </script>

</body>
</html>
